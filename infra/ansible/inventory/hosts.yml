---
# Static inventory — override with Terraform-generated inventory
# See: infra/terraform/provisioner.tf (local_file.ansible_inventory)
all:
  vars:
    ansible_user: cube
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    k3s_version: "v1.31.4+k3s1"
    domain: "cubevision.dev"
    github_owner: "n-drw"
    github_repository: "cubevision-dotfiles"

  children:
    build_servers:
      hosts:
        build-server:
          ansible_host: 192.168.1.100

    network_devices:
      hosts:
        jetson-orin:
          ansible_host: 192.168.1.10
          device_type: compute
        radar-awr2944:
          ansible_host: 192.168.1.20
          device_type: sensor
        cam-front:
          ansible_host: 192.168.1.30
          device_type: camera
        cam-rear:
          ansible_host: 192.168.1.31
          device_type: camera
        threadripper:
          ansible_host: 192.168.1.50
          device_type: workstation
