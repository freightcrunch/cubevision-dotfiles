---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - jq
      - yq
      - unzip
      - htop
      - tree
      - ripgrep
      - fd-find
      - tmux
      - zsh
      - build-essential
      - ca-certificates
      - gnupg
      - lsb-release
      - apt-transport-https
      - python3
      - python3-pip
      - python3-venv
      - net-tools
      - dnsutils
      - iputils-ping
      - nmap
      - tcpdump
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('America/Los_Angeles') }}"

- name: Configure sysctl for K3s and networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-cubevision.conf
    reload: true
  loop:
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.ipv6.conf.all.forwarding", value: "1" }
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "fs.inotify.max_user_watches", value: "524288" }
    - { key: "fs.inotify.max_user_instances", value: "512" }

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
  loop:
    - br_netfilter
    - overlay
    - ip_tables

- name: Configure /etc/hosts for local devices
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ".*{{ item.key }}\\.local$"
    line: "{{ item.value.ansible_host }}  {{ item.key }}.local {{ item.key }}"
    state: present
  loop: "{{ hostvars | dict2items }}"
  when: item.key in groups.get('network_devices', [])

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
