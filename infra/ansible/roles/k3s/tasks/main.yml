---
- name: Check if K3s is installed
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install K3s
  when: k3s_installed.rc != 0
  block:
    - name: Download K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Run K3s installer
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server"
        K3S_KUBECONFIG_MODE: "644"
      changed_when: true

    - name: Clean up installer
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent

- name: Configure K3s server
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      disable:
        - traefik
        - servicelb
      write-kubeconfig-mode: "0644"
      tls-san:
        - "{{ inventory_hostname }}"
        - "{{ ansible_host }}"
        - "{{ ansible_default_ipv4.address | default(ansible_host) }}"
      kubelet-arg:
        - "max-pods=250"
  notify: restart k3s

- name: Enable and start K3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for K3s to be ready
  ansible.builtin.command: kubectl get nodes --kubeconfig=/etc/rancher/k3s/k3s.yaml
  register: k3s_ready
  retries: 30
  delay: 5
  until: k3s_ready.rc == 0
  changed_when: false

- name: Set up kubeconfig for user
  block:
    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy kubeconfig
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        remote_src: true

- name: Install Helm
  block:
    - name: Check if Helm is installed
      ansible.builtin.command: helm version --short
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install Helm via script
      when: helm_installed.rc != 0
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

- name: Install k9s
  block:
    - name: Detect architecture for k9s
      ansible.builtin.set_fact:
        k9s_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Check if k9s is installed
      ansible.builtin.command: k9s version --short
      register: k9s_installed
      changed_when: false
      failed_when: false

    - name: Download and install k9s
      when: k9s_installed.rc != 0
      ansible.builtin.unarchive:
        src: "https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_{{ k9s_arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [k9s]
        mode: "0755"

- name: Show K3s status
  ansible.builtin.command: kubectl get nodes -o wide --kubeconfig=/etc/rancher/k3s/k3s.yaml
  register: k3s_nodes
  changed_when: false

- name: Display cluster status
  ansible.builtin.debug:
    msg: "{{ k3s_nodes.stdout_lines }}"
