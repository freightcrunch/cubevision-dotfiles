apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Flux system (auto-managed)
  - flux-system/

  # Infrastructure: sources, then releases (ordered by dependency)
  - sources.yaml
  - infrastructure.yaml
  - apps.yaml

  # CI/CD: Tekton (official upstream manifests, vendored)
  - tekton.yaml
