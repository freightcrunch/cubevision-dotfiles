---
# Tekton Pipelines/Tasks (ams-bol-system CI/CD + ops). Depends on Tekton being
# installed first so the CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pipelines
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: tekton
  path: ./infra/pipelines/ams-bol-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 10m
