---
# Self-hosted GitHub Actions runners on the build server via Actions Runner
# Controller (ARC). This lets ams-bol-system's existing .github/workflows run
# unchanged on local infrastructure (label: self-hosted / cubevision-build).
#
# Requires a secret in the arc-runners namespace with a GitHub PAT (or App):
#   kubectl create secret generic arc-github-auth \
#     --namespace=arc-runners \
#     --from-literal=github_token=ghp_XXXXXXXX
# PAT scopes (classic): repo. See SECRETS.md.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    toolkit.fluxcd.io/tenant: apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    toolkit.fluxcd.io/tenant: apps
---
# ARC controller manager
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  interval: 30m
  releaseName: arc
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
# Runner scale set bound to the ams-bol-system repository.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 30m
  releaseName: cubevision-build
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The runner registration target. Use the repo URL so runners are repo-scoped.
    githubConfigUrl: https://github.com/freightcrunch/ams-bol-system
    # Secret holding the GitHub PAT (key: github_token) — created out-of-band.
    githubConfigSecret: arc-github-auth
    # Workflows reference `runs-on: ubuntu-latest`; ARC also matches the
    # installation name "cubevision-build" as a runner label.
    minRunners: 0
    maxRunners: 3
    # K8s mode: each job runs in its own pod. dind not needed (no container builds).
    containerMode:
      type: "kubernetes"
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "4"
                memory: 8Gi
