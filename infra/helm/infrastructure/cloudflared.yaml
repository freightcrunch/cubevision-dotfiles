---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Token-based, dashboard-managed tunnel ("cubework").
  # Ingress/public-hostname routes are configured in the Cloudflare
  # Zero Trust dashboard, NOT here.
  #
  # The connector token is injected from the cloudflared-credentials
  # secret (keeps it out of git). Create it with:
  #   TOKEN=$(cloudflared tunnel token cubework)   # or copy from dashboard
  #   kubectl create secret generic cloudflared-credentials \
  #     --namespace=networking \
  #     --from-literal=tunnel-token="$TOKEN"
  valuesFrom:
    - kind: Secret
      name: cloudflared-credentials
      valuesKey: tunnel-token
      targetPath: cloudflare.tunnel_token
  values:
    replicaCount: 2
    cloudflare:
      tunnelName: cubework
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # The official cloudflare-tunnel-remote chart exposes no protocol/probe knobs.
  # On WSL2 the default QUIC/UDP transport fails to establish the control stream
  # ("datagram handler: context canceled"), and the chart's liveness probe
  # (failureThreshold=1, delay=10s) kills the pod before it can retry. Patch the
  # rendered Deployment to force HTTP/2 transport and give the probe headroom.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cloudflared-cloudflare-tunnel-remote
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: TUNNEL_TRANSPORT_PROTOCOL
                  value: http2
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
                value: 30
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 6
