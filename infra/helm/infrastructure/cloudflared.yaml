---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Token-based, dashboard-managed tunnel ("cubework").
  # Ingress/public-hostname routes are configured in the Cloudflare
  # Zero Trust dashboard, NOT here.
  #
  # The connector token is injected from the cloudflared-credentials
  # secret (keeps it out of git). Create it with:
  #   TOKEN=$(cloudflared tunnel token cubework)   # or copy from dashboard
  #   kubectl create secret generic cloudflared-credentials \
  #     --namespace=networking \
  #     --from-literal=tunnel-token="$TOKEN"
  valuesFrom:
    - kind: Secret
      name: cloudflared-credentials
      valuesKey: tunnel-token
      targetPath: cloudflare.tunnel_token
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
