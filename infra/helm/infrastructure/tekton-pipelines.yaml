---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-pipelines
  namespace: cicd
spec:
  interval: 30m
  chart:
    spec:
      chart: tekton-pipeline
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: tekton
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Tekton Pipelines — cloud-native CI/CD
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    webhook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi

    # Feature flags
    featureFlags:
      disable-affinity-assistant: "true"
      enable-api-fields: "beta"
      send-cloudevents-for-runs: "true"
