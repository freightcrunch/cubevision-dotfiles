---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ams-recover-from-blob
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: ams-bol-system
    ams.ops/source-workflow: recover-from-blob.yml
spec:
  description: Re-ingest files from Azure blob storage after waiting for backend health.
  params:
    - name: vm-user
      type: string
      default: piersignal
  workspaces:
    - name: ssh-creds
  steps:
    - name: recover-from-blob
      image: alpine:3.20
      env:
        - name: VM_USER
          value: $(params.vm-user)
        - name: VM_HOST
          valueFrom:
            secretKeyRef:
              name: ams-bol-secrets
              key: vm-host
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: ams-bol-secrets
              key: azure-storage-connection-string
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache openssh-client >/dev/null
        install -m700 -d /tekton/home/.ssh
        cp $(workspaces.ssh-creds.path)/ssh-privatekey /tekton/home/.ssh/id
        chmod 600 /tekton/home/.ssh/id
        ssh-keyscan -H "$VM_HOST" >> /tekton/home/.ssh/known_hosts 2>/dev/null || true
        ssh -i /tekton/home/.ssh/id -o UserKnownHostsFile=/tekton/home/.ssh/known_hosts \
          "${VM_USER}@${VM_HOST}" \
          AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
          'bash -s' <<'REMOTE'
        set -e
        cd /opt/piersignal
        sleep 15
        for i in $(seq 1 30); do
          curl -sf http://localhost:3001/health > /dev/null 2>&1 && { echo "Backend healthy ($i)"; break; }
          echo "  waiting 10s... ($i/30)"; sleep 10
        done
        curl -sf http://localhost:3001/health || { echo "Backend never came up"; exit 1; }
        pip3 install --quiet azure-storage-blob 2>/dev/null || pip3 install --quiet --break-system-packages azure-storage-blob 2>/dev/null || true
        BACKEND_PID=$(sudo systemctl show piersignal-backend -p MainPID --value 2>/dev/null || echo "")
        INTERNAL_TOKEN=""
        if [ -n "$BACKEND_PID" ] && [ "$BACKEND_PID" != "0" ]; then
          INTERNAL_TOKEN=$(sudo tr '\0' '\n' < /proc/$BACKEND_PID/environ 2>/dev/null | grep '^INTERNAL_API_TOKEN=' | sed 's/INTERNAL_API_TOKEN=//')
        fi
        [ -n "$INTERNAL_TOKEN" ] && curl -s -X POST http://localhost:3001/api/uploads/cleanup-stale -H "x-internal-token: $INTERNAL_TOKEN" || echo "skip cleanup"
        python3 scripts/sftp_download.py --from-blob --backend http://localhost:3001 --key /opt/piersignal/cbp/CBPAMSFOIA-JFSCHB 2>&1
        echo "=== Recovery complete ==="
        REMOTE
